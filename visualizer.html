<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC Prosperity Visualizer | Premium Edition</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.4.1/dist/react-apexcharts.iife.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0c;
            color: #e4e4e7;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass {
            background: rgba(18, 18, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sidebar-item-active {
            background: rgba(59, 130, 246, 0.1);
            border-right: 2px solid #3b82f6;
            color: #3b82f6;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .apexcharts-tooltip {
            background: #18181b !important;
            border: 1px solid #3f3f46 !important;
            color: #e4e4e7 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        }
    </style>
</head>
<body class="h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- UI Components ---
        const Icon = ({ name, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const Card = ({ children, title, className = "" }) => (
            <div className={`glass rounded-xl p-5 ${className}`}>
                {title && <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-4">{title}</h3>}
                {children}
            </div>
        );

        const Badge = ({ children, color = "blue" }) => {
            const colors = {
                blue: "bg-blue-500/10 text-blue-400 border-blue-500/20",
                green: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
                red: "bg-rose-500/10 text-rose-400 border-rose-500/20",
                amber: "bg-amber-500/10 text-amber-400 border-amber-500/20",
                zinc: "bg-zinc-500/10 text-zinc-400 border-zinc-500/20",
            };
            return (
                <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${colors[color]}`}>
                    {children}
                </span>
            );
        };

        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('OVERLAY');
            const [selectedRound, setSelectedRound] = useState('R5');
            const [selectedDay, setSelectedDay] = useState('TOTAL');
            const [selectedSources, setSelectedSources] = useState(['BACKTEST']);
            
            // Placeholder for data
            const [data, setData] = useState({
                backtest: [],
                live: [],
                i4bt: []
            });

            return (
                <div className="flex h-full w-full">
                    {/* Sidebar */}
                    <div className="w-64 border-r border-zinc-800 flex flex-col glass z-10">
                        <div className="p-6 border-b border-zinc-800">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-600/20">
                                    <Icon name="activity" className="text-white w-5 h-5" />
                                </div>
                                <h1 className="font-bold text-lg tracking-tight">Prosperity<span className="text-blue-500">Viz</span></h1>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto py-6 space-y-8">
                            {/* Source Filter */}
                            <div className="px-6 space-y-3">
                                <h2 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Sources</h2>
                                <div className="space-y-1">
                                    {['BACKTEST', 'I4BT', 'LIVE'].map(src => (
                                        <button 
                                            key={src}
                                            onClick={() => {
                                                setSelectedSources(prev => 
                                                    prev.includes(src) ? prev.filter(s => s !== src) : [...prev, src]
                                                )
                                            }}
                                            className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-all ${
                                                selectedSources.includes(src) ? 'bg-zinc-800 text-white' : 'text-zinc-500 hover:text-zinc-300'
                                            }`}
                                        >
                                            <span className="flex items-center gap-2">
                                                <div className={`w-1.5 h-1.5 rounded-full ${
                                                    src === 'BACKTEST' ? 'bg-blue-500' : src === 'I4BT' ? 'bg-emerald-500' : 'bg-rose-500'
                                                }`} />
                                                {src}
                                            </span>
                                            {selectedSources.includes(src) && <Icon name="check" className="w-3 h-3" />}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Round Filter */}
                            <div className="px-6 space-y-3">
                                <h2 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Rounds</h2>
                                <div className="grid grid-cols-3 gap-2">
                                    {['R3', 'R4', 'R5'].map(r => (
                                        <button 
                                            key={r}
                                            onClick={() => setSelectedRound(r)}
                                            className={`py-2 rounded-lg text-xs font-bold transition-all border ${
                                                selectedRound === r ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-600/20' : 'border-zinc-800 text-zinc-500 hover:border-zinc-700'
                                            }`}
                                        >
                                            {r}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Day Filter */}
                            <div className="px-6 space-y-3">
                                <h2 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Day</h2>
                                <div className="grid grid-cols-2 gap-2">
                                    {['TOTAL', 'D0', 'D1', 'D2', 'D3'].map(d => (
                                        <button 
                                            key={d}
                                            onClick={() => setSelectedDay(d)}
                                            className={`py-2 rounded-lg text-xs font-bold transition-all border ${
                                                selectedDay === d ? 'bg-zinc-100 border-white text-zinc-900' : 'border-zinc-800 text-zinc-500 hover:border-zinc-700'
                                            }`}
                                        >
                                            {d}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="p-6 border-t border-zinc-800 bg-zinc-900/30">
                            <button className="w-full flex items-center justify-center gap-2 py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm font-semibold transition-all">
                                <Icon name="refresh-cw" className="w-4 h-4" />
                                REFETCH DATA
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {/* Header Navigation */}
                        <header className="h-16 border-b border-zinc-800 flex items-center justify-between px-8 glass z-10">
                            <nav className="flex gap-8">
                                {['OVERLAY', 'COMPARE', 'ATTRIBUTION', 'STABILITY', 'MANAGER'].map(tab => (
                                    <button 
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`text-sm font-semibold transition-all relative py-5 ${
                                            activeTab === tab ? 'text-white' : 'text-zinc-500 hover:text-zinc-300'
                                        }`}
                                    >
                                        {tab}
                                        {activeTab === tab && (
                                            <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-blue-500" />
                                        )}
                                    </button>
                                ))}
                            </nav>

                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 px-3 py-1.5 bg-zinc-800/50 border border-zinc-700 rounded-lg text-xs font-medium text-zinc-400">
                                    <Icon name="clock" className="w-3.5 h-3.5" />
                                    <span>Last updated: Just now</span>
                                </div>
                                <button className="p-2 text-zinc-500 hover:text-white transition-all">
                                    <Icon name="download" className="w-5 h-5" />
                                </button>
                            </div>
                        </header>

                        {/* Viewport */}
                        <main className="flex-1 overflow-y-auto p-8 bg-[#0d0d0f]">
                            {activeTab === 'OVERLAY' && <OverlayView />}
                            {activeTab === 'COMPARE' && <div className="text-zinc-500 italic">Compare View Implementation Pending...</div>}
                            {activeTab === 'ATTRIBUTION' && <div className="text-zinc-500 italic">Attribution View Implementation Pending...</div>}
                            {activeTab === 'STABILITY' && <div className="text-zinc-500 italic">Stability View Implementation Pending...</div>}
                        </main>
                    </div>
                </div>
            );
        };

        const OverlayView = () => {
            const chartOptions = {
                chart: {
                    type: 'area',
                    background: 'transparent',
                    toolbar: { show: false },
                    zoom: { enabled: true },
                    animations: { enabled: true }
                },
                stroke: { curve: 'smooth', width: 2 },
                fill: {
                    type: 'gradient',
                    gradient: {
                        shadeIntensity: 1,
                        opacityFrom: 0.3,
                        opacityTo: 0.05,
                        stops: [0, 100]
                    }
                },
                colors: ['#3b82f6', '#10b981', '#f43f5e'],
                grid: {
                    borderColor: '#1f1f23',
                    strokeDashArray: 4,
                    xaxis: { lines: { show: true } }
                },
                xaxis: {
                    labels: { style: { colors: '#71717a', fontSize: '10px' } },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: {
                    labels: { 
                        style: { colors: '#71717a', fontSize: '10px' },
                        formatter: (v) => v.toLocaleString()
                    }
                },
                tooltip: { theme: 'dark' },
                legend: { show: false }
            };

            const series = [
                {
                    name: 'Trader Adin V3',
                    data: [10, 41, 35, 51, 49, 62, 69, 91, 148, 155, 170, 190]
                }
            ];

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-4 gap-6">
                        <Card title="Total PnL">
                            <div className="flex items-end justify-between">
                                <h4 className="text-2xl font-bold mono">142,520</h4>
                                <span className="text-emerald-500 text-sm font-bold flex items-center gap-1 mb-1">
                                    <Icon name="trending-up" className="w-3 h-3" />
                                    +12.4%
                                </span>
                            </div>
                        </Card>
                        <Card title="Max Drawdown">
                            <h4 className="text-2xl font-bold mono text-rose-400">-3,210</h4>
                        </Card>
                        <Card title="Sharpe Ratio">
                            <h4 className="text-2xl font-bold mono">2.84</h4>
                        </Card>
                        <Card title="Win Rate">
                            <h4 className="text-2xl font-bold mono">64.2%</h4>
                        </Card>
                    </div>

                    <Card title="Portfolio PnL Curve">
                        <div className="h-[400px]">
                            <ApexCharts options={chartOptions} series={series} type="area" height="100%" />
                        </div>
                    </Card>

                    <div className="grid grid-cols-3 gap-6">
                        <div className="col-span-2">
                            <Card title="Leaderboard">
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="text-[10px] uppercase text-zinc-500 border-b border-zinc-800">
                                            <th className="pb-3 font-bold">Trader</th>
                                            <th className="pb-3 font-bold">PnL</th>
                                            <th className="pb-3 font-bold">Max DD</th>
                                            <th className="pb-3 font-bold">Status</th>
                                            <th className="pb-3 font-bold">Readiness</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {[
                                            { name: 'trader_adin_v3', pnl: 142520, dd: -3210, status: 'GREEN', readiness: 95 },
                                            { name: 'trader_adin_v2', pnl: 98400, dd: -5400, status: 'AMBER', readiness: 82 },
                                            { name: 'trader_phi', pnl: 45200, dd: -1200, status: 'GREEN', readiness: 88 },
                                        ].map((t, idx) => (
                                            <tr key={idx} className="border-b border-zinc-800/50 hover:bg-zinc-800/20 transition-all cursor-pointer">
                                                <td className="py-4 font-medium flex items-center gap-3">
                                                    <div className="w-6 h-6 rounded bg-zinc-800 flex items-center justify-center text-[10px] font-bold text-zinc-400">
                                                        {idx + 1}
                                                    </div>
                                                    {t.name}
                                                </td>
                                                <td className="py-4 mono font-semibold">{t.pnl.toLocaleString()}</td>
                                                <td className="py-4 mono text-rose-400">{t.dd.toLocaleString()}</td>
                                                <td className="py-4"><Badge color={t.status.toLowerCase()}>{t.status}</Badge></td>
                                                <td className="py-4">
                                                    <div className="w-24 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                                                        <div className="h-full bg-blue-500" style={{ width: `${t.readiness}%` }} />
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </Card>
                        </div>
                        <Card title="Recent Activity">
                            <div className="space-y-4">
                                {[1, 2, 3, 4, 5].map(i => (
                                    <div key={i} className="flex gap-3 text-xs">
                                        <div className="w-1.5 h-1.5 rounded-full bg-blue-500 mt-1.5" />
                                        <div className="space-y-1">
                                            <p className="text-zinc-300 font-medium">New backtest run completed</p>
                                            <p className="text-zinc-500">trader_adin_v3 • Round 5 • Day 2</p>
                                            <p className="text-zinc-600 text-[10px]">2 hours ago</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
