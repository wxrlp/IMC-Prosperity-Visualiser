<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProsperityX Visualizer</title>
  <meta name="description" content="IMC Prosperity strategy visualizer with PnL charts, comparison, and attribution.">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--accent:#00ff9d;--bg:#040508;--surface:#0a0e14;--border:#1a1e26;--text:#e2e8f0;--dim:#545d6a}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
    .mono{font-family:'JetBrains Mono',monospace}
    .glass{background:rgba(10,14,20,0.88);backdrop-filter:blur(16px);border:1px solid var(--border)}

    /* Sidebar */
    #sidebar{width:300px;display:flex;flex-direction:column;padding:28px;gap:24px;border-right:1px solid var(--border)}
    #sidebar h1{font-size:22px;font-weight:900;text-transform:uppercase;font-style:italic;letter-spacing:-1px}
    #sidebar h1 span{color:var(--accent)}
    .logo-row{display:flex;align-items:center;gap:12px}
    .logo-icon{width:44px;height:44px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 24px rgba(0,255,157,0.35)}
    .section-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:2.5px;color:#555;margin-bottom:10px}
    .source-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .source-btn{padding:10px 8px;border-radius:14px;border:1px solid #222;background:transparent;color:#666;font-size:9px;font-weight:900;cursor:pointer;transition:all .15s}
    .source-btn:hover{border-color:#444}
    .source-btn.active{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 12px rgba(0,255,157,0.3)}
    .playback-box{border:1px solid var(--border);border-radius:16px;padding:16px}
    .playback-box input[type=range]{width:100%;margin:8px 0;accent-color:var(--accent)}
    .play-row{display:flex;gap:6px;margin-top:8px}
    .play-btn{flex:1;padding:10px;background:rgba(255,255,255,0.04);border:none;border-radius:10px;color:var(--text);cursor:pointer;font-size:13px}
    .play-btn:hover{background:rgba(255,255,255,0.08)}
    .sidebar-spacer{flex:1}

    /* Main */
    #main{flex:1;display:flex;flex-direction:column;min-width:0}
    #topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--border)}
    #tabs{display:flex;gap:32px;height:100%}
    .tab{background:none;border:none;color:#555;font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase;cursor:pointer;position:relative;height:100%;display:flex;align-items:center;transition:color .2s}
    .tab:hover{color:#999}
    .tab.active{color:#fff}
    .tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 16px rgba(0,255,157,0.5)}
    .status{text-align:right}
    .status-label{font-size:9px;font-weight:900;color:var(--accent);letter-spacing:2px;text-shadow:0 0 10px rgba(0,255,157,0.4)}
    .status-ver{font-size:11px;color:#555;font-weight:700}
    #content{flex:1;overflow-y:auto;padding:36px 40px}

    /* Cards */
    .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px}
    .card{border:1px solid var(--border);border-radius:24px;padding:28px;background:var(--surface)}
    .card-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:3px;color:#555;margin-bottom:16px}
    .card-value{font-size:32px;font-weight:900}
    .green{color:var(--accent);text-shadow:0 0 12px rgba(0,255,157,0.4)}
    .red{color:#ef4444}

    /* Chart area */
    .chart-area{border:1px solid var(--border);border-radius:24px;padding:28px;background:var(--surface);margin-bottom:28px}
    .chart-area .card-label{margin-bottom:12px}

    /* Leaderboard */
    .grid-2col{display:grid;grid-template-columns:2fr 1fr;gap:20px}
    .lb-table{width:100%}
    .lb-table tr{border-bottom:1px solid #111;cursor:pointer}
    .lb-table tr:hover{background:rgba(255,255,255,0.02)}
    .lb-table tr.selected{background:rgba(0,255,157,0.06)}
    .lb-table td{padding:14px 8px;font-size:12px}
    .lb-name{font-weight:900;text-transform:uppercase;letter-spacing:1.5px}
    .lb-sub{font-size:9px;color:#555;font-weight:700}
    .lb-pnl{text-align:right;font-weight:900}

    /* Gauge */
    .gauge{margin-bottom:14px}
    .gauge-header{display:flex;justify-content:space-between;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:#555;margin-bottom:5px}
    .gauge-track{height:5px;background:rgba(255,255,255,0.04);border-radius:99px;overflow:hidden}
    .gauge-fill{height:100%;border-radius:99px;transition:width .3s}

    /* Compare */
    .compare-selects{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
    .compare-selects select{width:100%;padding:12px;background:#0a0e14;border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;font-weight:700;outline:none}

    /* Attribution */
    .attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .attr-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #111}
    .attr-name{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px}
    .attr-contrib{font-size:9px;color:#555;font-weight:700}

    /* Scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:#222;border-radius:10px}

    /* Empty state */
    .empty{padding:80px;text-align:center;color:#444;font-style:italic;border:2px dashed var(--border);border-radius:32px}
  </style>
</head>
<body>
  <div id="sidebar" class="glass">
    <div class="logo-row">
      <div class="logo-icon">⚡</div>
      <h1>Prosperity<span>X</span></h1>
    </div>
    <div>
      <div class="section-label">Source</div>
      <div class="source-grid" id="source-btns"></div>
    </div>
    <div>
      <div class="section-label">Playback</div>
      <div class="playback-box">
        <div style="display:flex;justify-content:space-between">
          <span class="section-label" style="margin:0">Tick</span>
          <span class="mono" style="color:var(--accent);font-size:12px;font-weight:900" id="tick-display">0</span>
        </div>
        <input type="range" id="tick-slider" min="0" max="99" value="0">
        <div class="play-row">
          <button class="play-btn" id="play-btn">▶</button>
          <button class="play-btn" id="reset-btn" style="max-width:50px">↺</button>
        </div>
      </div>
    </div>
    <div class="sidebar-spacer"></div>
  </div>

  <div id="main">
    <div id="topbar" class="glass">
      <div id="tabs"></div>
      <div class="status">
        <div class="status-label">STANDALONE</div>
        <div class="status-ver">v4.0.0</div>
      </div>
    </div>
    <div id="content"></div>
  </div>

  <script src="sample_data.js"></script>
  <script src="backtest_comparison.js" onerror="console.log('no bt data')"></script>
  <script src="live_comparison.js" onerror="console.log('no live data')"></script>
  <script src="i4bt_comparison.js" onerror="console.log('no i4bt data')"></script>

  <script>
  (function(){
    // --- State ---
    const SOURCES = ['BACKTEST','LIVE','I4BT','REAL','SCENARIO','STRESS'];
    const TABS = ['OVERLAY','COMPARE','ATTRIBUTION'];
    let state = {
      source: 'BACKTEST',
      tab: 'OVERLAY',
      selectedId: null,
      baselineId: null,
      candidateId: null,
      tick: 0,
      playing: false,
      playInterval: null
    };

    function getData() {
      const map = {
        BACKTEST: window.BACKTEST_DATA || [],
        LIVE: window.LIVE_LOG_DATA || [],
        I4BT: window.I4BT_DATA || [],
        REAL: window.REAL_DATA_RESULTS || [],
        SCENARIO: window.SCENARIO_RESULTS || [],
        STRESS: window.STRESS_RESULTS || []
      };
      return map[state.source] || [];
    }

    function getSelected() {
      const data = getData();
      return data.find(d => d.id === state.selectedId) || data[0] || null;
    }

    // --- Source Buttons ---
    function renderSources() {
      const el = document.getElementById('source-btns');
      el.innerHTML = '';
      SOURCES.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'source-btn' + (s === state.source ? ' active' : '');
        btn.textContent = s;
        btn.onclick = () => { state.source = s; state.selectedId = null; renderAll(); };
        el.appendChild(btn);
      });
    }

    // --- Tabs ---
    function renderTabs() {
      const el = document.getElementById('tabs');
      el.innerHTML = '';
      TABS.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (t === state.tab ? ' active' : '');
        btn.textContent = t;
        btn.onclick = () => { state.tab = t; renderContent(); renderTabs(); };
        el.appendChild(btn);
      });
    }

    // --- Playback ---
    function setupPlayback() {
      const slider = document.getElementById('tick-slider');
      const display = document.getElementById('tick-display');
      const playBtn = document.getElementById('play-btn');
      const resetBtn = document.getElementById('reset-btn');

      slider.oninput = () => {
        state.tick = parseInt(slider.value);
        display.textContent = state.tick;
        renderContent();
      };
      playBtn.onclick = () => {
        state.playing = !state.playing;
        playBtn.textContent = state.playing ? '⏸' : '▶';
        if (state.playing) {
          state.playInterval = setInterval(() => {
            state.tick = state.tick < 99 ? state.tick + 1 : 0;
            slider.value = state.tick;
            display.textContent = state.tick;
            renderContent();
          }, 150);
        } else {
          clearInterval(state.playInterval);
        }
      };
      resetBtn.onclick = () => {
        state.tick = 0;
        slider.value = 0;
        display.textContent = 0;
        renderContent();
      };
    }

    // --- Overlay View ---
    let pnlChart = null;
    function renderOverlay() {
      const content = document.getElementById('content');
      const data = getData();
      const sel = getSelected();
      if (!sel) { content.innerHTML = '<div class="empty">No data loaded for this source.</div>'; return; }

      const pt = sel.history[Math.min(state.tick, sel.history.length - 1)] || {pnl:0, products:{}};
      const pnlVal = typeof pt.pnl === 'number' ? pt.pnl : 0;
      const maxDd = sel.max_dd || 0;
      const sharpe = sel.sharpe || 0;

      let html = '<div class="kpi-row">';
      html += '<div class="card"><div class="card-label">PnL</div><div class="card-value green mono">' + Math.round(pnlVal).toLocaleString() + '</div></div>';
      html += '<div class="card"><div class="card-label">Max Drawdown</div><div class="card-value red mono">' + Math.round(maxDd).toLocaleString() + '</div></div>';
      html += '<div class="card"><div class="card-label">Sharpe</div><div class="card-value mono">' + sharpe + '</div></div>';
      html += '</div>';

      html += '<div class="chart-area"><div class="card-label">Equity Curve</div><div id="pnl-chart" style="height:300px"></div></div>';

      html += '<div class="grid-2col">';
      // Gauges
      html += '<div class="card"><div class="card-label">Product Exposure</div>';
      const prods = pt.products || {};
      Object.keys(prods).forEach(p => {
        const v = Math.abs(prods[p]);
        const pct = Math.min(v / 80 * 100, 100);
        const col = pct > 90 ? '#ef4444' : pct > 70 ? '#f59e0b' : '#00ff9d';
        html += '<div class="gauge"><div class="gauge-header"><span>' + p + '</span><span class="mono">' + Math.round(prods[p]) + ' / 80</span></div>';
        html += '<div class="gauge-track"><div class="gauge-fill" style="width:' + pct + '%;background:' + col + ';box-shadow:0 0 8px ' + col + '"></div></div></div>';
      });
      html += '</div>';

      // Leaderboard
      html += '<div class="card"><div class="card-label">Strategies</div><table class="lb-table"><tbody>';
      data.forEach(t => {
        const isSel = t.id === (state.selectedId || (data[0] && data[0].id));
        html += '<tr class="' + (isSel ? 'selected' : '') + '" data-id="' + t.id + '">';
        html += '<td><div class="lb-name">' + t.trader + '</div><div class="lb-sub">' + (t.round||'') + ' ' + (t.day||'') + '</div></td>';
        html += '<td class="lb-pnl mono green">' + (t.final_pnl||0).toLocaleString() + '</td></tr>';
      });
      html += '</tbody></table></div></div>';

      content.innerHTML = html;

      // Leaderboard click
      content.querySelectorAll('[data-id]').forEach(row => {
        row.onclick = () => { state.selectedId = row.dataset.id; renderContent(); };
      });

      // PnL Chart
      const chartData = sel.history.map((h, i) => ({x: i, y: h.pnl}));
      if (pnlChart) { pnlChart.destroy(); pnlChart = null; }
      pnlChart = new ApexCharts(document.getElementById('pnl-chart'), {
        chart: {type:'area',background:'transparent',toolbar:{show:false},animations:{enabled:false}},
        series: [{name:'PnL',data:chartData}],
        stroke: {curve:'smooth',width:2},
        fill: {type:'gradient',gradient:{opacityFrom:0.35,opacityTo:0.05}},
        colors: ['#00ff9d'],
        grid: {borderColor:'#1a1e26',strokeDashArray:4},
        xaxis: {labels:{show:false},axisBorder:{show:false},axisTicks:{show:false}},
        yaxis: {labels:{style:{colors:'#545d6a'},formatter:v=>Math.round(v).toLocaleString()}},
        tooltip: {theme:'dark'},
        annotations: {xaxis:[{x:state.tick,borderColor:'#00ff9d',label:{text:'T'+state.tick,style:{color:'#000',background:'#00ff9d',fontWeight:'900'}}}]}
      });
      pnlChart.render();
    }

    // --- Compare View ---
    let compareChart = null;
    function renderCompare() {
      const content = document.getElementById('content');
      const data = getData();
      if (data.length < 1) { content.innerHTML = '<div class="empty">Need at least 1 strategy to compare.</div>'; return; }

      const bl = data.find(d=>d.id===state.baselineId) || data[0];
      const cd = data.find(d=>d.id===state.candidateId) || data[1] || data[0];

      let opts = '';
      data.forEach(d => { opts += '<option value="'+d.id+'">'+d.trader+' ('+(d.round||'')+' '+(d.day||'')+')</option>'; });

      let html = '<div class="compare-selects">';
      html += '<div class="card"><div class="card-label">Baseline</div><select id="sel-bl">'+opts+'</select></div>';
      html += '<div class="card"><div class="card-label">Candidate</div><select id="sel-cd">'+opts+'</select></div>';
      html += '</div>';
      html += '<div class="chart-area"><div class="card-label">Alpha Analysis</div><div id="compare-chart" style="height:380px"></div></div>';
      content.innerHTML = html;

      document.getElementById('sel-bl').value = bl.id;
      document.getElementById('sel-cd').value = cd.id;
      document.getElementById('sel-bl').onchange = e => { state.baselineId = e.target.value; renderCompare(); };
      document.getElementById('sel-cd').onchange = e => { state.candidateId = e.target.value; renderCompare(); };

      const alphaData = bl.history.map((h,i) => ({x:i, y:(cd.history[i]?.pnl||0)-h.pnl}));

      if (compareChart) { compareChart.destroy(); compareChart = null; }
      compareChart = new ApexCharts(document.getElementById('compare-chart'), {
        chart:{type:'line',background:'transparent',toolbar:{show:false}},
        series:[
          {name:'Baseline: '+bl.trader,data:bl.history.map((h,i)=>({x:i,y:h.pnl}))},
          {name:'Candidate: '+cd.trader,data:cd.history.map((h,i)=>({x:i,y:h.pnl}))},
          {name:'Alpha (Diff)',data:alphaData}
        ],
        stroke:{curve:'smooth',width:[2,2,3]},
        colors:['#545d6a','#00ff9d','#ff00ff'],
        grid:{borderColor:'#1a1e26',strokeDashArray:4},
        xaxis:{labels:{show:false}},
        yaxis:{labels:{style:{colors:'#545d6a'}}},
        legend:{position:'top',horizontalAlign:'right',labels:{colors:'#e2e8f0'}},
        tooltip:{theme:'dark'}
      });
      compareChart.render();
    }

    // --- Attribution View ---
    let attrChart = null;
    function renderAttribution() {
      const content = document.getElementById('content');
      const sel = getSelected();
      if (!sel || !sel.final_pnl_by_product) { content.innerHTML = '<div class="empty">No product-level data available.</div>'; return; }

      const pnlData = sel.final_pnl_by_product;
      const products = Object.keys(pnlData);
      const values = Object.values(pnlData);

      let html = '<div class="attr-grid">';
      html += '<div class="card"><div class="card-label">Product Attribution</div><div id="attr-chart" style="height:300px"></div></div>';
      html += '<div class="card"><div class="card-label">Efficiency</div><div style="margin-top:20px">';
      products.forEach(p => {
        const v = pnlData[p];
        const pct = sel.final_pnl !== 0 ? ((v / sel.final_pnl) * 100).toFixed(1) : '0.0';
        const col = v >= 0 ? 'green' : 'red';
        html += '<div class="attr-row"><div><div class="attr-name">' + p + '</div><div class="attr-contrib">Contribution: ' + pct + '%</div></div>';
        html += '<div class="mono ' + col + '" style="font-weight:900">' + (v>=0?'+':'') + v.toLocaleString() + '</div></div>';
      });
      html += '</div></div></div>';
      content.innerHTML = html;

      if (attrChart) { attrChart.destroy(); attrChart = null; }
      attrChart = new ApexCharts(document.getElementById('attr-chart'), {
        chart:{type:'bar',background:'transparent',toolbar:{show:false}},
        series:[{name:'PnL',data:values}],
        plotOptions:{bar:{borderRadius:6,horizontal:true,distributed:true}},
        colors:['#00ff9d','#00d1ff','#ff4757','#ffa502','#cc44ff'],
        xaxis:{categories:products,labels:{style:{colors:'#545d6a'}}},
        yaxis:{labels:{style:{colors:'#545d6a'}}},
        grid:{borderColor:'#1a1e26'},
        legend:{show:false},
        tooltip:{theme:'dark'}
      });
      attrChart.render();
    }

    // --- Render ---
    function renderContent() {
      if (state.tab === 'OVERLAY') renderOverlay();
      else if (state.tab === 'COMPARE') renderCompare();
      else if (state.tab === 'ATTRIBUTION') renderAttribution();
    }

    function renderAll() {
      renderSources();
      renderTabs();
      renderContent();
    }

    // --- Init ---
    renderAll();
    setupPlayback();
  })();
  </script>
</body>
</html>
